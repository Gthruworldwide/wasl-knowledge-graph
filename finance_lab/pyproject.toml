[project]
name = "wasl-finance-lab"
version = "0.1.0"
description = "Local Python lab for market, gold and portfolio analytics."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "scipy>=1.15,<2",
  "statsmodels>=0.14.4,<0.15",
  "matplotlib>=3.10,<4",
  "plotly>=6,<7",
  "requests>=2.32,<3",
  "python-dotenv>=1.0,<2",
  "yfinance>=0.2.54,<0.3",
  "yahooquery>=2.4,<3",
  "ta>=0.11,<0.12",
  "pandas-ta>=0.4.67b0,<0.5",
  "mplfinance>=0.12,<0.13",
  "backtrader>=1.9.78.123,<2",
  "PyPortfolioOpt>=1.5.5,<2",
  "riskfolio-lib>=7.0,<8",
  "quantstats>=0.0.62,<0.1",
  "ffn>=1.1.1,<2",
  "ccxt>=4.4,<5",
  "akshare>=1.16,<2",
  "Nasdaq-Data-Link>=1.0,<2",
  "twelvedata>=1.1.8,<2",
  "finnhub-python>=2.4,<3",
  "pytest>=8.3,<9",
]

[project.optional-dependencies]
# Heavy / native builds are opt-in so the base environment installs reliably
# on Windows. Install with: uv sync --extra heavy
# vectorbt is already pulled in by riskfolio-lib, so only OpenBB is extra here.
heavy = [
  "openbb>=4.5,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_lab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
